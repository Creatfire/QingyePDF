# Qingye PDF for Android (0.9.5).
# Every push / pull request that touches the shared UI, the backend worker or mobile/: unit tests,
# web bundle, debug APK, then the phone-viewport end-to-end suite in Chromium.
# A release APK is built as well when the signing secrets below are configured; tag pushes (v*)
# attach the APKs to the draft GitHub release that ci.yml creates for the Windows build.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['mobile/**', 'ui/**', 'vendor/**', 'backend/worker.py', '*.cjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'ui/**', 'vendor/**', 'backend/worker.py', '*.cjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Cache Python wheels (checksum verified)
        uses: actions/cache@v4
        with:
          path: mobile/vendor-mobile/wheels/*.whl
          key: wheels-${{ hashFiles('mobile/vendor-mobile/wheels/SHA256SUMS') }}

      - name: PDF.js (checksum verified)
        working-directory: .
        run: test -f vendor/pdfjs/build/pdf.mjs || node scripts/prepare-pdfjs.mjs

      - name: Unit tests
        run: npm test

      - name: Web bundle
        run: npm run build:web

      - name: Copy into the Android project
        run: npx cap sync android

      - name: Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Release APK (only with signing secrets)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QINGYE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QINGYE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QINGYE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/qingye.keystore"
          QINGYE_KEYSTORE_FILE="$RUNNER_TEMP/qingye.keystore" ./gradlew assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/qingye.keystore"

      - name: Collect
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/QingyePDF-$version-android-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk "dist/QingyePDF-$version-android.apk"; fi
          (cd dist && sha256sum *.apk | tee SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: qingye-android-${{ github.sha }}
          path: |
            mobile/dist/*.apk
            mobile/dist/SHA256SUMS-android.txt
          retention-days: 14

      - name: End-to-end tests (phone viewport, Chromium)
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e

      - name: Attach to the draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            mobile/dist/*.apk
            mobile/dist/SHA256SUMS-android.txt
