# Qingye PDF for Linux (0.17.0).
# Every push / pull request: unit tests, an AppImage and a .deb (x64).
# Tag pushes (v*) attach both packages to the draft GitHub release that ci.yml creates.
#
# Signing: AppImage and .deb distributed through GitHub Releases need no code signing;
# no secrets are required for this workflow.
name: linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare PDF.js and Pandoc (checksum verified)
        run: |
          node scripts/prepare-pdfjs.mjs
          bash scripts/prepare-pandoc.sh

      - name: Cache frozen backend
        id: backend-cache
        uses: actions/cache@v4
        with:
          path: backend/bin
          key: backend-linux-x64-${{ hashFiles('backend/worker.py', 'backend/requirements.txt', 'scripts/build-backend.sh') }}

      - name: Build frozen backend
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-backend.sh

      - name: Backend self-check
        run: |
          file backend/bin/QingyeWorker/QingyeWorker
          vendor/pandoc/pandoc --version | head -1

      - name: Prepare backend test environment (cache hit)
        if: steps.backend-cache.outputs.cache-hit == 'true'
        run: |
          python3 -m venv .backend-build
          .backend-build/bin/python -m pip install -r backend/requirements.txt

      - name: Unit tests
        run: npm test

      # The window suites were written against Windows; on Linux they are informative for now.
      - name: Electron smoke suites
        continue-on-error: true
        run: node scripts/ci-smoke.cjs --report test-output/ci-smoke-linux-x64.json

      - name: Build AppImage and deb
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Check the unpacked bundle
        run: |
          test -x dist/linux-unpacked/resources/backend/QingyeWorker
          test -x dist/linux-unpacked/resources/pandoc/pandoc
          test -f dist/linux-unpacked/resources/ocr/chi_sim.traineddata
          # The bundled engines must start from inside the bundle.
          dist/linux-unpacked/resources/pandoc/pandoc --version | head -1
          printf '{}' > /tmp/empty-job.json
          dist/linux-unpacked/resources/backend/QingyeWorker /tmp/empty-job.json || true
          ls -la dist/*.AppImage dist/*.deb
          sha256sum dist/*.AppImage dist/*.deb | tee dist/SHA256SUMS-linux-x64.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingye-linux-x64-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux-*.txt
            test-output/**/*.json
            test-output/**/*.png
            test-output/**/*.log
          retention-days: 14

      - name: Attach to draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux-*.txt
